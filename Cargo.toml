[package]
name = "graphtime"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4", features = ["derive"] }
wasmtime = "49"
wasmtime-wasi = "49"
tokio = { version = "1", features = ["full"] }
env_logger = "0.11"
log = "0.4"
frame-buffer-wasmtime = "0.4"
surface-wasmtime = { version = "0.4", features = ["winit", "surface-webgpu", "surface-frame-buffer"] }
wasi-webgpu-wasmtime = "0.4"
